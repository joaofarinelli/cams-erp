name: Build PDV agent (Windows .exe)

on:
  push:
    branches: [main, agent-windows-build]
    paths:
      - "agent/dev/**"
      - ".github/workflows/build-agent-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent/dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python==4.10.0.84 httpx==0.27.2 numpy==1.26.4 websockets==12.0 pystray==0.19.5 pillow==10.4.0 onnxruntime==1.19.2 pyinstaller==6.10.0

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg | Out-Null
          Copy-Item $bin.FullName ffmpeg/
          Copy-Item $ffprobe.FullName ffmpeg/

      - name: Build with PyInstaller
        run: pyinstaller agent.spec --noconfirm

      - name: Stage release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse dist/cams-agent release/cams-agent
          Copy-Item -Recurse ffmpeg release/ffmpeg
          Copy-Item run-agent.bat release/run-agent.bat
          Copy-Item README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath cams-agent-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: cams-agent-windows
          path: agent/dev/cams-agent-windows.zip
          retention-days: 30

      - name: Attach to release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dev/cams-agent-windows.zip
