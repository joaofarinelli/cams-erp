[project]
name = "cams-erp-agent-dev"
version = "0.1.0"
description = "Dev-only Python agent stub: RTSP -> motion -> upload clip -> POST event"
requires-python = ">=3.11"
dependencies = [
  "opencv-python>=4.10",
  "httpx>=0.27",
  "numpy>=1.26",
  "websockets>=12.0",
  "pystray>=0.19",
  "pillow>=10.0",
  "onnxruntime>=1.18",
  "win11toast>=0.36; sys_platform == 'win32'",
  "cryptography>=42.0",
]
