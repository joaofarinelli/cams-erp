[project]
name = "cams-erp-inference"
version = "0.1.0"
description = "VLM-based inference worker for cams-erp (Claude Haiku 4.5 vision)"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "opencv-python>=4.10",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "ultralytics>=8.4.42",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
